# Base config — shared defaults. Other configs merge on top of this.

seeds: [0, 1, 2, 3, 4]

data:
  # PCMMD — Andrade et al., Sci Data 12:161 (2025), DOI 10.1038/s41597-025-04459-1.
  # License CC BY 4.0 -> split files (Phase 2 deliverable) are releasable with citation.
  # download.py resolves the Mendeley DOI; fails loudly with instructions if a manual
  # step is needed (never guesses a URL).
  mendeley_doi: "10.17632/3v2nrxpr9s.1"
  raw_root: data/raw/pcmmd
  processed_root: data/processed

  # PCMMD has three subsets. Paths are relative to raw_root. audit.py reports
  # absent subsets rather than crashing.
  # Experiment-family separation (state explicitly in the manuscript):
  #   - cell-level classification (Phases 3,4) -> 'labeled' (3,546 cells).
  #   - patient-level splitting/aggregation (Phases 2,7) -> 'patient_organized'
  #     ONLY, the sole subset carrying patient IDs + diagnoses.
  subsets:
    labeled:                  # labeled plasma / non-plasma; ~46% plasma / 54% non
      path: labeled
      has_patient_ids: false
      expected_total: 3546
    patient_organized:        # patient-organized cells with diagnoses (has patient IDs)
      path: patient_organized
      has_patient_ids: true
      expected_total: 2021
    segmented:                # segmented plasma / non-plasma
      path: segmented
      has_patient_ids: false
      expected_plasma: 1615
      expected_non_plasma: 1931

  image_exts: [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".bmp"]
  # Folder names that map to a class label (case-insensitive substring match).
  class_keywords:
    plasma: ["plasma", "pos", "positive"]
    non_plasma: ["non", "neg", "negative", "normal"]

  # Subset that classical/quantum models train on by default. Splits for it are
  # written as splits/seedX_{train,val,test}.csv (doc-exact names).
  primary_subset: labeled

# Phase 2 — reproducible patient-level / stratified splits.
split:
  ratios: [0.70, 0.15, 0.15]   # train / val / test
  # Auto: patient-level (group by patient, no overlap) where IDs exist,
  # stratified-by-class otherwise. Class strata also applied at patient level
  # via each patient's majority class when both are available.
  subsets: [labeled, patient_organized, segmented]

# Phase 2 — dataset transforms. Identical augmentation config reused for EVERY model.
augmentation:
  enabled: true                # train split only; val/test never augmented
  brightness: 0.2
  contrast: 0.2
  # 'stain' jitter approximated via hue/saturation in HED-like color space.
  stain_hue: 0.05
  stain_saturation: 0.2
  blur_kernel: 3
  blur_sigma: [0.1, 1.5]
  hflip: 0.5
  vflip: 0.5

normalize:
  # PCMMD channel stats from the real audit (results/dataset_summary.csv, labeled
  # subset, 3,546 cells). Falls back to ImageNet stats if null.
  mean: [0.5625, 0.4532, 0.6703]
  std: [0.1857, 0.2125, 0.1644]
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

image:
  size: 64                    # 64x64 default; 128 optional
  channels: 3

paths:
  results: results
  figures: figures
  checkpoints: checkpoints
  splits: splits

logging:
  device_log: true            # log torch device every run
  wandb: false                # CSV logging is the fallback

smoke:
  max_images: 20              # audit smoke cap
  max_samples: 200            # training smoke cap
  seeds: [0]
